# Environnement local : `docker compose up -d` puis `pnpm dev`.
# L'API et le worker tournent sur la machine hôte (hot reload) ; seuls les services tiers sont conteneurisés.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: polaris_owner
      POSTGRES_PASSWORD: polaris
      POSTGRES_DB: polaris
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polaris_owner -d polaris']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: polaris
      MINIO_ROOT_PASSWORD: polaris-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']

volumes:
  pgdata:
  miniodata:
