name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10

jobs:
  quality:
    name: Lint, types, frontières, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
        # TODO retirer continue-on-error après le premier `pnpm format` commité par l'équipe
        continue-on-error: true
      - run: pnpm build --filter=@polaris/contracts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm --filter @polaris/api db:check-migrations

  test:
    name: Tests unitaires et d'intégration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polaris_owner
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U polaris_owner -d polaris_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://polaris_owner:polaris@localhost:5432/polaris_test
      DATABASE_URL_TEST_APP: postgres://polaris_app:polaris_app@localhost:5432/polaris_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Rôles PostgreSQL (app sans BYPASSRLS, platform avec)
        run: |
          psql "$DATABASE_URL_TEST" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE polaris_app LOGIN PASSWORD 'polaris_app' NOBYPASSRLS;" \
            -c "CREATE ROLE polaris_platform LOGIN PASSWORD 'polaris_platform' BYPASSRLS;"
      - run: pnpm build --filter=@polaris/contracts
      - name: Migrations up → down → up (expand/contract)
        run: |
          cd apps/api
          MIGRATION_DATABASE_URL=$DATABASE_URL_TEST pnpm db:migrate
          MIGRATION_DATABASE_URL=$DATABASE_URL_TEST pnpm db:rollback
          MIGRATION_DATABASE_URL=$DATABASE_URL_TEST pnpm db:migrate
      - run: pnpm test
      - run: pnpm test:integration
      - name: Contrat OpenAPI (routes documentées, SDK à jour)
        run: |
          cd apps/api && DATABASE_URL=$DATABASE_URL_TEST_APP DATABASE_URL_PLATFORM=$DATABASE_URL_TEST pnpm openapi:generate
          cd ../../packages/contracts && pnpm sdk:generate
          git diff --exit-code -- src/sdk/schema.d.ts || echo "::warning::SDK régénéré : committer packages/contracts/src/sdk/schema.d.ts si la spec a changé"

  build:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
            ghcr.io/${{ github.repository }}/worker:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Déploiement staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Migration puis déploiement rolling
        run: |
          echo "1) migration expand : docker run ghcr.io/${{ github.repository }}/api:${{ github.sha }} node dist/database/migrate.js up"
          echo "2) déploiement rolling api + worker avec l'image ${{ github.sha }} (commande du PaaS retenu, voir docs/runbooks/deploy-rollback.md)"
          echo "3) smoke : curl -f \$STAGING_URL/api/v1/health/ready"
          echo "À câbler sur le PaaS choisi en Phase 0 (secret STAGING_DEPLOY_HOOK)."

  deploy-production:
    name: Déploiement production (tag)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref_type == 'tag'
    environment: production
    steps:
      - name: Promotion de l'image déjà validée en staging
        run: |
          echo "Promotion de ghcr.io/${{ github.repository }}/api:${{ github.sha }} — même image, aucune reconstruction."
          echo "Voir docs/runbooks/deploy-rollback.md ; fenêtre interdite 7h–9h heure locale."
