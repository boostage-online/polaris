name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PR_NUMBER: ${{ github.event.pull_request.number }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  quality:
    name: Lint, types, frontières, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Installer (génère et commite le lockfile s'il manque)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            .github/scripts/run-step.sh "pnpm install" pnpm install --frozen-lockfile
          else
            .github/scripts/run-step.sh "pnpm install (lockfile initial)" pnpm install --no-frozen-lockfile
            if [ -n "$PR_NUMBER" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add pnpm-lock.yaml
              git commit -m "chore(ci): pnpm-lock.yaml généré par la CI [skip ci]" || true
              git push || echo "::warning::lockfile non poussé (droits) — committer pnpm-lock.yaml manuellement"
            fi
          fi
      - run: .github/scripts/run-step.sh "format:check" pnpm format:check
        continue-on-error: true # TODO retirer après le premier `pnpm format` commité par l'équipe
      - run: .github/scripts/run-step.sh "build contracts" pnpm build --filter=@polaris/contracts
      - run: .github/scripts/run-step.sh "typecheck" pnpm typecheck
      - run: .github/scripts/run-step.sh "lint" pnpm lint
      - run: .github/scripts/run-step.sh "depcruise" pnpm depcruise
      - run: .github/scripts/run-step.sh "check-migrations" pnpm --filter @polaris/api db:check-migrations

  test:
    name: Tests unitaires et d'intégration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polaris_owner
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U polaris_owner -d polaris_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://polaris_owner:polaris@localhost:5432/polaris_test
      DATABASE_URL_TEST_APP: postgres://polaris_app:polaris_app@localhost:5432/polaris_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: .github/scripts/run-step.sh "pnpm install" pnpm install --frozen-lockfile
      - name: Rôles PostgreSQL (app sans BYPASSRLS, platform avec)
        run: |
          psql "$DATABASE_URL_TEST" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE polaris_app LOGIN PASSWORD 'polaris_app' NOBYPASSRLS;" \
            -c "CREATE ROLE polaris_platform LOGIN PASSWORD 'polaris_platform' BYPASSRLS;"
      - run: .github/scripts/run-step.sh "build contracts" pnpm build --filter=@polaris/contracts
      - name: Migrations up → down → up (expand/contract)
        env:
          MIGRATION_DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: |
          cd apps/api
          ../../.github/scripts/run-step.sh "db:migrate" pnpm db:migrate
          ../../.github/scripts/run-step.sh "db:rollback" pnpm db:rollback
          ../../.github/scripts/run-step.sh "db:migrate (2)" pnpm db:migrate
      - run: .github/scripts/run-step.sh "test unitaires" pnpm test
      - run: .github/scripts/run-step.sh "test intégration" pnpm test:integration
      - name: Exercice de restauration (sauvegarde → base jetable → invariants, RTO mesuré)
        env:
          PGPASSWORD: polaris
        run: |
          .github/scripts/run-step.sh "restore-drill" ops/db/restore-drill.sh "$DATABASE_URL_TEST" "postgres://polaris_owner:polaris@localhost:5432/polaris_restore" restore-report.md
          cat restore-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Contrat OpenAPI (routes documentées, SDK à jour)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST_APP }}
          DATABASE_URL_PLATFORM: ${{ env.DATABASE_URL_TEST }}
        run: |
          .github/scripts/run-step.sh "openapi:generate" pnpm --filter @polaris/api openapi:generate
          .github/scripts/run-step.sh "sdk:generate" pnpm --filter @polaris/contracts sdk:generate
          git diff --exit-code -- packages/contracts/src/sdk/schema.d.ts || echo "::warning::SDK régénéré : committer packages/contracts/src/sdk/schema.d.ts si la spec a changé"

  security:
    name: Sécurité (dépendances, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit des dépendances (bloquant à partir de « high » en production)
        run: |
          pnpm audit --prod --audit-level=high || {
            echo "::error::Vulnérabilités « high » ou « critical » dans les dépendances de production — mettre à jour (Partie 14) ou documenter une exception dans docs/security/checklist.md"
            exit 1
          }
          pnpm audit --audit-level=high || echo "::warning::Vulnérabilités dans les dépendances de développement (non bloquant)"
      - name: Recherche de secrets dans l'historique (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --no-banner --exit-code 1 \
            || { echo "::error::Secret potentiel détecté par gitleaks : révoquer, purger l'historique, puis documenter l'incident (docs/runbooks/data-breach.md)"; exit 1; }

  build:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [quality, test, security]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
            ghcr.io/${{ github.repository }}/worker:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Déploiement staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Migration puis déploiement rolling
        run: |
          echo "1) migration expand : docker run ghcr.io/${{ github.repository }}/api:${{ github.sha }} node dist/database/migrate.js up"
          echo "2) déploiement rolling api + worker (commande du PaaS retenu, voir docs/runbooks/deploy-rollback.md)"
          echo "3) smoke : curl -f \$STAGING_URL/api/v1/health/ready"
          echo "À câbler sur le PaaS choisi en Phase 0 (secret STAGING_DEPLOY_HOOK)."

  deploy-production:
    name: Déploiement production (tag)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref_type == 'tag'
    environment: production
    steps:
      - name: Promotion de l'image déjà validée en staging
        run: |
          echo "Promotion de ghcr.io/${{ github.repository }}/api:${{ github.sha }} — même image, aucune reconstruction."
          echo "Voir docs/runbooks/deploy-rollback.md ; fenêtre interdite 7h–9h heure locale."
