  'GET /api/v1/trace/notifications/:id': { allow: [ADMIN, DIRECTION] }
  'GET /api/v1/scheduled-reports': { allow: [ADMIN, ACADEMIC_HEAD, DIRECTION] }
  'POST /api/v1/scheduled-reports': { allow: [ADMIN, ACADEMIC_HEAD, DIRECTION] }
