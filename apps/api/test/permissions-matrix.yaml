  'GET /api/v1/reports/:key': { allow: [ADMIN, STUDENT_LIFE, ACADEMIC_HEAD, DIRECTION] }
  'GET /api/v1/reports/:key.csv': { allow: [ADMIN, STUDENT_LIFE, ACADEMIC_HEAD, DIRECTION] }
  'GET /api/v1/dashboards/direction': { allow: [ADMIN, ACADEMIC_HEAD, DIRECTION] }
  'GET /api/v1/dashboards/pedagogy': { allow: [ADMIN, STUDENT_LIFE, ACADEMIC_HEAD, DIRECTION] }
  'GET /api/v1/dashboards/finance/channels': { allow: [ADMIN, DIRECTION, FINANCE] }
